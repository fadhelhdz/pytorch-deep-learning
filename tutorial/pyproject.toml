[project]
name = "tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.11.0",
    "mlxtend>=0.25.0",
    "numpy==2.4.4",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "torch==2.12.1",
    "torchmetrics>=1.9.0",
    "torchvision==0.27.1",
    "tqdm>=4.68.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
